apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudnotes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cloudnotes
  template:
    metadata:
      labels:
        app: cloudnotes
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: cloudnotes-workload:1.0.0
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: cloudnotes-config
                  key: APP_ENV
            - name: DATA_DIR
              valueFrom:
                configMapKeyRef:
                  name: cloudnotes-config
                  key: DATA_DIR
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudnotes-access
                  key: API_TOKEN
          volumeMounts:
            - name: notes
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: notes
          persistentVolumeClaim:
            claimName: cloudnotes-data
